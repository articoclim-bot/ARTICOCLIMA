* { box-sizing: border-box; margin: 0; padding: 0; }
body {

h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }

/* filters */
.filters {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center;
}
.filters label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chip {
  padding: 4px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--fg); font-size: .8rem; cursor: pointer;
  transition: all .15s;
}
.chip:hover { border-color: var(--acc); }
.chip.active { background: var(--acc); border-color: var(--acc); color: #fff; }

/* summary bar */
.summary {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
}
.stat {
  display: flex; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 14px; font-size: .82rem;
}
.stat-num { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-ok   { color: var(--ok); }
.stat-warn { color: var(--warn); }
.stat-err  { color: var(--err); }
.stat-info { color: var(--info); }

.brand-section { margin-bottom: 28px; }
.brand-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 2px solid var(--acc);
}
.brand-name { font-size: 1rem; font-weight: 700; }
.brand-badge { font-size: .72rem; color: var(--muted); font-weight: 500; }

.series-card {
  border: 1px solid var(--border); border-top: none;

.series-card:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.series-title {

.models-tag { font-size: .72rem; color: var(--muted); font-weight: 500; }

.row.miss { background: var(--info-bg); border-color: transparent; }

.row-label { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
.row-val   { font-size: .84rem; }
.row-ref   { font-size: .84rem; color: var(--muted); }

.badge {

.badge-ok   { background: var(--ok-bg);   color: var(--ok); }

// â”€â”€ render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let filterMarca = 'all', filterStatus = 'all';

function statusInfo(s) {
  const map = {
    ok:   { label:'âœ“ Correto',    cls:'badge-ok',   rowCls:'ok' },
    diff: { label:'âŒ Diferente', cls:'badge-diff',  rowCls:'diff' },
    warn: { label:'âš ï¸ Verificar', cls:'badge-warn',  rowCls:'warn' },
    miss: { label:'ï¼‹ Em falta',  cls:'badge-miss',  rowCls:'miss' },
  };
  return map[s] || map.ok;
}

function render() {
  const el = document.getElementById('content');
  let html = '';
  let totOk=0, totDiff=0, totWarn=0, totMiss=0;

  DATA.forEach(brand => {
    if (filterMarca !== 'all' && brand.marca !== filterMarca) return;

    const rows = brand.rows.filter(r => filterStatus === 'all' || r.status === filterStatus);
    const vis = rows.length > 0;

    DATA.forEach(b => {
      b.rows.forEach(r => {
        if (r.status==='ok')   totOk++;
        else if (r.status==='diff') totDiff++;
        else if (r.status==='warn') totWarn++;
        else if (r.status==='miss') totMiss++;
      });
    });

    if (!vis) return;

    html += `<div class="brand-section" data-marca="${brand.marca}">
      <div class="brand-header">
        <span class="brand-name">${brand.marca}</span>
        <span class="brand-badge">${brand.series}</span>
        <span class="fonte-tag">${brand.fonte_status === 'ok' ? 'âœ“ Fonte verificada' : 'âš  Dados parciais'}</span>
      </div>
      <div class="series-card">
        <div class="series-title">
          <span>${brand.series}</span>
          <span class="models-tag">${brand.modelos}</span>
        </div>
        <div class="col-header">
          <span class="col-h">Campo</span>
          <span class="col-h">Backoffice (atual)</span>
          <span class="col-h">Online (verificado)</span>
          <span class="col-h">Estado</span>
        </div>
        <div class="rows">`;
    rows.forEach(r => {
      const si = statusInfo(r.status);
      html += `<div class="row ${si.rowCls}">
        <span class="row-label">${r.label}</span>
        <span class="row-val">${r.bo}</span>
        <span class="row-ref ${r.status !== 'ok' ? 'highlight' : ''}">${r.online}</span>
        <span><span class="badge ${si.cls}">${si.label}</span></span>
      </div>`;
      if (r.nota) html += `<div style="padding:2px 10px 6px 150px;font-size:.76rem;color:var(--muted);">ðŸ’¬ ${r.nota}</div>`;
    });
    html += `</div>
        <div class="fonte-nota">Fonte: <strong>${brand.fonte}</strong></div>
      </div>
    </div>`;
  });

  el.innerHTML = html || '<p style="color:var(--muted);padding:20px">Nenhum resultado para os filtros selecionados.</p>';

  // summary
  const s = document.getElementById('summary');
  s.innerHTML = `
    <div class="stat"><span class="stat-num stat-ok">${totOk}</span> <span>Corretos</span></div>
    <div class="stat"><span class="stat-num stat-diff">${totDiff}</span> <span>Diferentes</span></div>
    <div class="stat"><span class="stat-num stat-warn">${totWarn}</span> <span>A verificar</span></div>
    <div class="stat"><span class="stat-num stat-info">${totMiss}</span> <span>Em falta</span></div>
  `;
}

// recalculate totals properly
function calcTotals() {
  let ok=0, diff=0, warn=0, miss=0;
  DATA.forEach(b => b.rows.forEach(r => {
    if (r.status==='ok') ok++;
    else if (r.status==='diff') diff++;
    else if (r.status==='warn') warn++;
    else if (r.status==='miss') miss++;
  }));
  document.getElementById('summary').innerHTML = `
    <div class="stat"><span class="stat-num stat-ok">${ok}</span> <span>Corretos</span></div>
    <div class="stat"><span class="stat-num stat-diff">${diff}</span> <span>Diferentes</span></div>
    <div class="stat"><span class="stat-num stat-warn">${warn}</span> <span>A verificar</span></div>
    <div class="stat"><span class="stat-num stat-info">${miss}</span> <span>Em falta</span></div>
  `;
}

function setFilter(type, val, btn) {
  if (type === 'marca') {
    filterMarca = val;
    document.querySelectorAll('.filters button').forEach((b,i) => { if(i<4) b.classList.toggle('active', b===btn); });
  } else {
    filterStatus = val;
    document.querySelectorAll('.filters button').forEach((b,i) => { if(i>=4) b.classList.toggle('active', b===btn); });
  }
  render();
}

render();
calcTotals();
</script>
